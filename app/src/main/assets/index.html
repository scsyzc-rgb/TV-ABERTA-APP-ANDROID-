<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINTONIA — Player IPTV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root{
    --bg: #0a0c10;
    --bg-panel: #12151b;
    --bg-card: #171b22;
    --line: #23282f;
    --text: #eef1f5;
    --muted: #8b93a1;
    --signal: #00d9ff;
    --signal-dim: #0a3540;
    --live: #ff5a36;
    --amber: #ffb020;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  ::selection{ background:var(--signal); color:#000; }

  /* Header */
  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 20px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-family: 'Oswald','Arial Narrow',sans-serif;
    letter-spacing:0.14em;
  }
  .brand .mark{
    font-size:22px;
    font-weight:700;
    color:var(--text);
  }
  .brand .mark span{ color:var(--signal); }
  .dot-live{
    width:7px;height:7px;border-radius:50%;
    background:var(--live);
    box-shadow:0 0 8px var(--live);
    display:inline-block;
    animation:pulse 1.6s infinite;
    margin-right:6px;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .search-wrap{
    flex:1;
    max-width:420px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 12px 9px 34px;
    border-radius:6px;
    font-size:13px;
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{ border-color:var(--signal); }
  .search-wrap svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:14px;height:14px; stroke:var(--muted);
  }

  .count-badge{
    font-family:'JetBrains Mono','Consolas',monospace;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }
  .count-badge b{ color:var(--signal); font-weight:600; }

  /* Layout */
  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* Category rail */
  nav.cats{
    width:190px;
    flex-shrink:0;
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:10px 0;
  }
  nav.cats::-webkit-scrollbar{ width:6px; }
  nav.cats::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .cat-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 16px;
    font-size:12.5px;
    color:var(--muted);
    cursor:pointer;
    border-left:2px solid transparent;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:background .12s, color .12s;
  }
  .cat-item:hover{ background:var(--bg-card); color:var(--text); }
  .cat-item.active{
    background:var(--signal-dim);
    color:var(--signal);
    border-left-color:var(--signal);
    font-weight:600;
  }
  .cat-item small{ font-family:'JetBrains Mono',monospace; opacity:.7; font-size:10px; }

  /* Channel grid */
  main.grid-wrap{
    flex:1;
    overflow-y:auto;
    padding:16px 18px 40px;
  }
  main.grid-wrap::-webkit-scrollbar{ width:8px; }
  main.grid-wrap::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px,1fr));
    gap:10px;
  }
  .chan-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-align:center;
    transition:transform .1s, border-color .1s, background .1s;
    position:relative;
  }
  .chan-card:hover{ border-color:var(--signal); transform:translateY(-2px); }
  .chan-card.playing{
    border-color:var(--signal);
    background:var(--signal-dim);
  }
  .chan-num{
    position:absolute; top:8px; left:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--amber);
    opacity:.75;
  }
  .chan-logo-box{
    width:56px; height:56px;
    border-radius:6px;
    background:#0d1015;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    margin-top:6px;
  }
  .chan-logo-box img{ max-width:100%; max-height:100%; object-fit:contain; }
  .chan-logo-box .fallback{
    font-family:'Oswald',sans-serif;
    font-size:18px; font-weight:700; color:var(--muted);
  }
  .chan-name{
    font-size:12px;
    line-height:1.3;
    color:var(--text);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .empty-state{
    color:var(--muted);
    text-align:center;
    padding:60px 20px;
    font-size:13px;
  }

  /* Player overlay */
  .player-overlay{
    position:fixed; inset:0;
    background:#000;
    display:none;
    z-index:100;
    flex-direction:column;
  }
  .player-overlay.active{ display:flex; }
  .player-top{
    display:flex; align-items:center; gap:12px;
    padding:12px 18px;
    background:linear-gradient(to bottom, rgba(0,0,0,.85), transparent);
    position:absolute; top:0; left:0; right:0;
    z-index:5;
  }
  .player-top .pname{ font-size:14px; font-weight:600; }
  .player-top .pcat{ font-size:11px; color:var(--muted); }
  .btn-close{
    margin-left:auto;
    background:rgba(255,255,255,.08);
    border:1px solid var(--line);
    color:var(--text);
    width:34px; height:34px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .btn-close:hover{ background:var(--live); border-color:var(--live); }
  video{
    width:100%; height:100%;
    object-fit:contain;
    background:#000;
  }
  .player-status{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
    color:var(--muted);
    font-size:13px;
    pointer-events:none;
  }
  .spinner{
    width:34px;height:34px;
    border:3px solid var(--line);
    border-top-color:var(--signal);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .status-err{ color:var(--live); max-width:420px; text-align:center; padding:0 20px; }

  /* Tela de Carregamento Automático Inicial */
  .source-screen{
    position:fixed; inset:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    flex-direction:column;
    gap:22px;
    padding:20px;
    text-align:center;
  }
  .source-screen.hidden{ display:none; }
  .source-screen h1{
    font-family:'Oswald',sans-serif;
    font-size:30px;
    letter-spacing:.1em;
    margin:0;
  }
  .source-screen h1 span{ color:var(--signal); }

  /* TV Mode / Controle Remoto */
  html.tv-mode, html.tv-mode body { width:100%; height:100%; overflow:hidden; }
  .tv-mode body { font-size:18px; }
  .tv-mode header { padding:18px 28px; min-height:72px; }
  .tv-mode .brand .mark { font-size:28px; }
  .tv-mode .search-wrap { max-width:520px; }
  .tv-mode .search-wrap input { font-size:18px; padding:13px 16px 13px 42px; }
  .tv-mode nav.cats { width:250px; padding:14px 0; }
  .tv-mode .cat-item { padding:14px 20px; font-size:17px; }
  .tv-mode main.grid-wrap { padding:22px 26px 50px; }
  .tv-mode .grid { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; }
  .tv-mode .chan-card { min-height:190px; padding:18px 14px; border-radius:12px; gap:12px; }
  .tv-mode .chan-logo-box { width:78px; height:78px; margin-top:8px; }
  .tv-mode .chan-name { font-size:17px; }
  .tv-mode .chan-card.tv-focus,
  .tv-mode .cat-item.tv-focus,
  .tv-mode #searchInput.tv-focus {
    outline:4px solid var(--signal);
    outline-offset:3px;
    box-shadow:0 0 20px rgba(0,217,255,.35);
    transform:scale(1.035);
    z-index:10;
  }
  .tv-mode .cat-item.tv-focus { transform:none; background:var(--signal-dim); color:var(--signal); }

  .tv-help {
    position:fixed; right:24px; bottom:18px; z-index:500;
    background:rgba(0,0,0,.78); border:1px solid var(--line);
    color:var(--muted); border-radius:8px; padding:8px 12px;
    font:13px system-ui,sans-serif; pointer-events:none;
  }
</style>
</head>
<body>

<!-- Tela de Carregamento Automático Inicial -->
<div id="sourceScreen" class="source-screen">
  <h1><span class="dot-live"></span>SINTONI<span>A</span></h1>
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:14px;" id="loadingText">Carregando canais de TV, aguarde...</div>
</div>

<header id="mainHeader" style="display:none;">
  <div class="brand">
    <div class="mark"><span class="dot-live"></span>SINTONI<span>A</span></div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar canal...">
  </div>
  <div class="count-badge" id="countBadge"></div>
</header>

<div class="layout" id="mainLayout" style="display:none;">
  <nav class="cats" id="catsNav"></nav>
  <main class="grid-wrap">
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">Nenhum canal encontrado.</div>
  </main>
</div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-top">
    <div>
      <div class="pname" id="pName"></div>
      <div class="pcat" id="pCat"></div>
    </div>
    <button class="btn-close" id="btnClose">✕</button>
  </div>
  <video id="video" controls autoplay playsinline></video>
  <div class="player-status" id="playerStatus"></div>
</div>

<script>
// Ativa o modo TV para facilitar visualização e navegação por controle
document.documentElement.classList.add('tv-mode');

// URL padrão da lista M3U. Se tiver uma lista personalizada para ela, substitua o link abaixo:
const M3U_URL = "https://iptv-org.github.io/iptv/index.m3u";

let channels = [];
let activeCategory = "TODOS";
let hls = null;

// Busca automática ao carregar a página
window.addEventListener('DOMContentLoaded', async () => {
  const loadingText = document.getElementById('loadingText');
  try {
    const text = await fetchWithFallback(M3U_URL);
    loadPlaylist(text);
  } catch (err) {
    loadingText.textContent = "Erro ao carregar canais. Tente atualizar a página.";
    console.error(err);
  }
});

async function fetchWithFallback(url){
  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.text();
  }catch(err1){
    document.getElementById('loadingText').textContent = 'Tentando servidor alternativo...';
    const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    const res2 = await fetch(proxied, { cache: 'no-store' });
    if(!res2.ok) throw new Error('HTTP ' + res2.status);
    return await res2.text();
  }
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const result = [];
  let current = null;
  for(let raw of lines){
    const line = raw.trim();
    if(!line) continue;
    if(line.startsWith('#EXTINF')){
      const meta = line.substring(line.indexOf(':')+1);
      const commaIdx = meta.lastIndexOf(',');
      const attrsPart = commaIdx >= 0 ? meta.substring(0, commaIdx) : meta;
      const name = commaIdx >= 0 ? meta.substring(commaIdx+1).trim() : 'Sem nome';
      const logoMatch = attrsPart.match(/tvg-logo="([^"]*)"/);
      const groupMatch = attrsPart.match(/group-title="([^"]*)"/);
      current = {
        name: name || 'Sem nome',
        logo: logoMatch ? logoMatch[1] : '',
        group: groupMatch ? groupMatch[1] : 'Outros',
        url: ''
      };
    } else if(!line.startsWith('#') && current){
      current.url = line;
      result.push(current);
      current = null;
    }
  }
  return result;
}

function loadPlaylist(text){
  const parsed = parseM3U(text);
  if(parsed.length === 0){
    document.getElementById('loadingText').textContent = 'Nenhum canal encontrado na lista.';
    return;
  }
  channels = parsed;
  document.getElementById('sourceScreen').classList.add('hidden');
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('mainLayout').style.display = 'flex';
  buildCategories();
  renderGrid();
}

// Categorias
const CATEGORY_PT = {
  'general': 'Geral', 'news': 'Notícias', 'entertainment': 'Entretenimento',
  'movies': 'Filmes', 'sports': 'Esportes', 'kids': 'Infantil', 'music': 'Música',
  'culture': 'Cultura', 'documentary': 'Documentários', 'series': 'Séries'
};

function translateCategory(cat){
  if(!cat) return 'Outros';
  return CATEGORY_PT[cat.trim().toLowerCase()] || cat;
}

function buildCategories(){
  const counts = {};
  channels.forEach(c => { counts[c.group] = (counts[c.group]||0)+1; });
  const cats = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const nav = document.getElementById('catsNav');
  nav.innerHTML = '';
  
  const allItem = document.createElement('div');
  allItem.className = 'cat-item active';
  allItem.innerHTML = `<span>Todos os canais</span><small>${channels.length}</small>`;
  allItem.onclick = () => selectCategory('TODOS', allItem);
  nav.appendChild(allItem);

  cats.forEach(cat => {
    const item = document.createElement('div');
    item.className = 'cat-item';
    item.innerHTML = `<span>${escapeHtml(translateCategory(cat))}</span><small>${counts[cat]}</small>`;
    item.onclick = () => selectCategory(cat, item);
    nav.appendChild(item);
  });
}

function selectCategory(cat, el){
  activeCategory = cat;
  document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = channels;
  if(activeCategory !== 'TODOS') list = list.filter(c => c.group === activeCategory);
  if(search) list = list.filter(c => c.name.toLowerCase().includes(search));

  document.getElementById('countBadge').innerHTML = `<b>${list.length}</b> canais`;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const capped = list.slice(0, 400);
  capped.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'chan-card';
    const num = String(idx+1).padStart(3,'0');
    card.innerHTML = `
      <div class="chan-num">${num}</div>
      <div class="chan-logo-box">
        ${c.logo ? `<img src="${escapeHtml(c.logo)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'fallback\\'>${escapeHtml(initials(c.name))}</div>'">` : `<div class="fallback">${escapeHtml(initials(c.name))}</div>`}
      </div>
      <div class="chan-name">${escapeHtml(c.name)}</div>
    `;
    card.onclick = () => playChannel(c);
    grid.appendChild(card);
  });
}

function initials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

document.getElementById('searchInput').addEventListener('input', renderGrid);

// Player
const overlay = document.getElementById('playerOverlay');
const video = document.getElementById('video');
const statusEl = document.getElementById('playerStatus');

function playChannel(c){
  document.getElementById('pName').textContent = c.name;
  document.getElementById('pCat').textContent = translateCategory(c.group);
  overlay.classList.add('active');
  statusEl.innerHTML = '<div class="spinner"></div>';

  if(hls){ hls.destroy(); hls = null; }
  video.pause();
  video.removeAttribute('src');

  const url = c.url;
  if(url.includes('.m3u8') && window.Hls && Hls.isSupported()){
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      statusEl.innerHTML = '';
      video.play().catch(()=>{});
    });
  } else {
    video.src = url;
    video.play().then(()=>{ statusEl.innerHTML=''; }).catch(()=>{});
  }
}

document.getElementById('btnClose').addEventListener('click', closePlayer);
function closePlayer(){
  overlay.classList.remove('active');
  if(hls){ hls.destroy(); hls = null; }
  video.pause();
}
</script>

<div class="tv-help" id="tvHelp">Toque ou clique em um canal para assistir</div>

</body>
</html>

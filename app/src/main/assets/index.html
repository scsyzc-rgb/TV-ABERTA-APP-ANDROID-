<!DOCTYPE html>
<html lang="pt-BR" class="tv-mode">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINTONIA — Player IPTV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root{
    --bg: #0a0c10;
    --bg-panel: #12151b;
    --bg-card: #171b22;
    --line: #23282f;
    --text: #eef1f5;
    --muted: #8b93a1;
    --signal: #00d9ff;
    --signal-dim: #0a3540;
    --live: #ff5a36;
    --danger: #e74c3c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);width:100%;overflow:hidden;}
  body{
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 24px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand .mark{
    font-size:24px;
    font-weight:700;
    letter-spacing:0.1em;
  }
  .brand .mark span{ color:var(--signal); }
  .dot-live{
    width:8px;height:8px;border-radius:50%;
    background:var(--live);
    box-shadow:0 0 8px var(--live);
    display:inline-block;
    margin-right:6px;
  }

  .search-wrap{ flex:1; max-width:400px; position:relative; }
  .search-wrap input{
    width:100%;
    background:var(--bg);
    border:2px solid var(--line);
    color:var(--text);
    padding:10px 14px;
    border-radius:6px;
    font-size:15px;
    outline:none;
  }

  .btn-reset {
    background: rgba(231, 76, 60, 0.15);
    border: 1px solid var(--danger);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    outline: none;
    transition: all 0.2s;
  }

  .layout{ flex:1; display:flex; min-height:0; }

  nav.cats{
    width:220px;
    flex-shrink:0;
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:10px 0;
  }
  .cat-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 18px;
    font-size:15px;
    color:var(--muted);
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .cat-item.active{
    background:var(--signal-dim);
    color:var(--signal);
    border-left-color:var(--signal);
    font-weight:600;
  }

  main.grid-wrap{ flex:1; overflow-y:auto; padding:20px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:14px;
  }
  
  .chan-card{
    background:var(--bg-card);
    border:2px solid var(--line);
    border-radius:8px;
    padding:14px 10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-align:center;
    outline:none;
  }

  .chan-card:focus, .cat-item:focus, #searchInput:focus, .btn-reset:focus {
    border-color: var(--signal) !important;
    box-shadow: 0 0 18px rgba(0,217,255,0.4);
    transform: scale(1.04);
    background: var(--signal-dim);
    outline: none;
  }

  .chan-logo-box{
    width:64px; height:64px;
    border-radius:6px;
    background:#0d1015;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .chan-logo-box img{ max-width:100%; max-height:100%; object-fit:contain; }
  .chan-name{ font-size:14px; color:var(--text); }

  .player-overlay{
    position:fixed; inset:0;
    background:#000;
    display:none;
    z-index:100;
  }
  .player-overlay.active{ display:flex; flex-direction:column; }
  video{ width:100%; height:100%; background:#000; }

  .player-osd{
    position:absolute; top:20px; left:20px;
    background:rgba(0,0,0,0.8); color:var(--text);
    padding:10px 18px; border-radius:8px;
    border:1px solid var(--signal);
    font-size:18px; font-weight:600;
    pointer-events:none; z-index:110;
    display:none;
  }

  .source-screen{
    position:fixed; inset:0;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    z-index:200; flex-direction:column; gap:16px;
  }
  .source-screen.hidden{ display:none; }
  .spinner{
    width:36px;height:36px;
    border:3px solid var(--line);
    border-top-color:var(--signal);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="sourceScreen" class="source-screen">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:16px;" id="loadingText">Testando integridade das transmissões...</div>
</div>

<header id="mainHeader" style="display:none;">
  <div class="brand"><div class="mark"><span class="dot-live"></span>SINTONI<span>A</span></div></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Buscar canal..." tabindex="0">
  </div>
  <button class="btn-reset" id="btnReset" tabindex="0">🔄 Restaurar Canais</button>
</header>

<div class="layout" id="mainLayout" style="display:none;">
  <nav class="cats" id="catsNav"></nav>
  <main class="grid-wrap">
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-osd" id="playerOsd"></div>
  <video id="video" autoplay playsinline></video>
</div>

<script>
const M3U_URL = "https://iptv-org.github.io/iptv/languages/por.m3u";
let channels = [];
let filteredChannels = [];
let currentChannelIndex = -1;
let activeCategory = "TODOS";
let hls = null;
let osdTimeout = null;
let streamTimeout = null;

let deadChannels = JSON.parse(localStorage.getItem('sintonia_dead_channels') || '[]');

window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('btnReset').onclick = resetDeletedChannels;
  try {
    const text = await fetchWithFallback(M3U_URL);
    await loadAndVerifyPlaylist(text);
  } catch (err) {
    document.getElementById('loadingText').textContent = "Erro ao carregar lista de canais.";
  }
});

async function fetchWithFallback(url){
  try{
    const res = await fetch(url, { cache: 'no-store' });
    return await res.text();
  }catch(err){
    const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    const res2 = await fetch(proxied, { cache: 'no-store' });
    return await res2.text();
  }
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const result = [];
  let current = null;
  for(let line of lines){
    line = line.trim();
    if(!line) continue;
    if(line.startsWith('#EXTINF')){
      const name = line.substring(line.lastIndexOf(',')+1).trim();
      const logoMatch = line.match(/tvg-logo="([^"]*)"/);
      const groupMatch = line.match(/group-title="([^"]*)"/);
      current = {
        name: name || 'Sem nome',
        logo: logoMatch ? logoMatch[1] : '',
        group: groupMatch ? groupMatch[1] : 'Outros',
        url: ''
      };
    } else if(!line.startsWith('#') && current){
      current.url = line;
      if (current.url.startsWith('http') && !deadChannels.includes(current.url)) {
        result.push(current);
      }
      current = null;
    }
  }
  return result;
}

async function verifyStreamHealth(chan) {
  return new Promise((resolve) => {
    const controller = new AbortController();
    const timer = setTimeout(() => { controller.abort(); resolve(null); }, 4000);

    fetch(chan.url, { method: 'GET', signal: controller.signal, headers: { 'Range': 'bytes=0-500' } })
      .then(res => {
        if (!res.ok && res.status !== 206) throw new Error('HTTP status offline');
        return res.text();
      })
      .then(body => {
        clearTimeout(timer);
        if (body.includes('#EXTM3U') || body.includes('#EXTINF') || chan.url.includes('.m3u8')) {
          resolve(chan);
        } else {
          resolve(chan);
        }
      })
      .catch(() => {
        clearTimeout(timer);
        if (!deadChannels.includes(chan.url)) {
          deadChannels.push(chan.url);
          localStorage.setItem('sintonia_dead_channels', JSON.stringify(deadChannels));
        }
        resolve(null);
      });
  });
}

async function loadAndVerifyPlaylist(text){
  const parsed = parseM3U(text);
  const total = parsed.length;
  document.getElementById('loadingText').textContent = `Testando ${total} canais...`;
  
  const chunkSize = 10;
  let verified = [];

  for (let i = 0; i < parsed.length; i += chunkSize) {
    const chunk = parsed.slice(i, i + chunkSize);
    const results = await Promise.all(chunk.map(chan => verifyStreamHealth(chan)));
    verified.push(...results.filter(c => c !== null));
    document.getElementById('loadingText').textContent = `Validando transmissões... (${verified.length} OK / ${total} total)`;
  }

  channels = verified;

  document.getElementById('sourceScreen').classList.add('hidden');
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('mainLayout').style.display = 'flex';
  buildCategories();
  renderGrid();

  setTimeout(() => {
    focusFirstCard();
  }, 300);
}

function buildCategories(){
  const nav = document.getElementById('catsNav');
  nav.innerHTML = '';
  
  const allItem = document.createElement('div');
  allItem.className = 'cat-item active';
  allItem.tabIndex = 0;
  allItem.textContent = "Todos os canais";
  allItem.onclick = () => selectCategory('TODOS', allItem);
  nav.appendChild(allItem);
}

function selectCategory(cat, el){
  activeCategory = cat;
  renderGrid();
}

function renderGrid(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  filteredChannels = channels;

  if(activeCategory !== 'TODOS'){
    filteredChannels = filteredChannels.filter(c => c.group === activeCategory);
  }
  if(search){
    filteredChannels = filteredChannels.filter(c => c.name.toLowerCase().includes(search));
  }

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  filteredChannels.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'chan-card';
    card.id = `card-${idx}`;
    card.dataset.index = idx;
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="chan-logo-box">
        ${c.logo ? `<img src="${c.logo}" loading="lazy" onerror="this.remove()">` : ''}
      </div>
      <div class="chan-name">${c.name}</div>
    `;
    card.onclick = () => playChannel(idx);
    card.addEventListener('keydown', (e) => {
      const code = e.keyCode || e.which;
      if(e.key === 'Enter' || code === 13) playChannel(idx);
    });
    grid.appendChild(card);
  });
}

function focusFirstCard(){
  const firstCard = document.querySelector('.chan-card');
  if(firstCard) firstCard.focus();
}

function permanentlyRemoveChannel(index) {
  if (index < 0 || index >= filteredChannels.length) return;
  const target = filteredChannels[index];
  
  if (target && target.url) {
    if (!deadChannels.includes(target.url)) {
      deadChannels.push(target.url);
      localStorage.setItem('sintonia_dead_channels', JSON.stringify(deadChannels));
    }
  }

  channels = channels.filter(c => c.url !== target.url);
  renderGrid();
}

function resetDeletedChannels() {
  if (confirm("Deseja restaurar todos os canais excluídos e recarregar o app?")) {
    localStorage.removeItem('sintonia_dead_channels');
    window.location.reload();
  }
}

// CORREÇÃO DE NAVEGAÇÃO DO CONTROLE REMOTO
const searchInput = document.getElementById('searchInput');
const btnReset = document.getElementById('btnReset');

searchInput.addEventListener('input', renderGrid);

searchInput.addEventListener('keydown', (e) => {
  const code = e.keyCode || e.which;
  if(e.key === 'Enter' || code === 13) {
    e.preventDefault();
    renderGrid();
    searchInput.blur();
    focusFirstCard();
  }
  if(e.key === 'ArrowDown' || code === 40) {
    e.preventDefault();
    searchInput.blur();
    focusFirstCard();
  }
});

btnReset.addEventListener('keydown', (e) => {
  const code = e.keyCode || e.which;
  if(e.key === 'ArrowDown' || code === 40) {
    e.preventDefault();
    btnReset.blur();
    focusFirstCard();
  }
});

const overlay = document.getElementById('playerOverlay');
const video = document.getElementById('video');
const osd = document.getElementById('playerOsd');

function showOsd(text){
  osd.textContent = text;
  osd.style.display = 'block';
  if(osdTimeout) clearTimeout(osdTimeout);
  osdTimeout = setTimeout(() => { osd.style.display = 'none'; }, 3000);
}

video.onplaying = () => {
  if(streamTimeout) {
    clearTimeout(streamTimeout);
    streamTimeout = null;
  }
};

function handleFailedStream(index, name) {
  if(streamTimeout) clearTimeout(streamTimeout);
  showOsd(`❌ Sem sinal (Removido)`);
  permanentlyRemoveChannel(index);
  setTimeout(() => {
    closePlayer();
  }, 1500);
}

function playChannel(index){
  if(index < 0 || index >= filteredChannels.length) return;
  currentChannelIndex = index;
  const c = filteredChannels[currentChannelIndex];

  overlay.classList.add('active');
  showOsd(`📺 ${c.name}`);

  if(hls){ hls.destroy(); hls = null; }
  if(streamTimeout) clearTimeout(streamTimeout);

  streamTimeout = setTimeout(() => {
    handleFailedStream(index, c.name);
  }, 5000);

  if(c.url.includes('.m3u8') && window.Hls && Hls.isSupported()){
    hls = new Hls({ manifestLoadingTimeOut: 4000 });
    hls.loadSource(c.url);
    hls.attachMedia(video);
    
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => handleFailedStream(index, c.name));
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        handleFailedStream(index, c.name);
      }
    });
  } else {
    video.src = c.url;
    video.play().catch(() => handleFailedStream(index, c.name));
  }
}

function closePlayer(){
  if(streamTimeout) clearTimeout(streamTimeout);
  overlay.classList.remove('active');
  if(hls){ hls.destroy(); hls = null; }
  video.pause();
  video.removeAttribute('src');
  
  setTimeout(() => {
    const currentCard = document.querySelector(`.chan-card[data-index="${currentChannelIndex}"]`);
    if(currentCard) {
      currentCard.focus();
    } else {
      focusFirstCard();
    }
  }, 100);
}

document.addEventListener('keydown', (e) => {
  const code = e.keyCode || e.which;
  const isPlayerActive = overlay.classList.contains('active');

  if (isPlayerActive) {
    if (e.key === 'ArrowUp' || code === 38 || code === 19) {
      e.preventDefault();
      if (currentChannelIndex > 0) {
        playChannel(currentChannelIndex - 1);
      } else {
        playChannel(filteredChannels.length - 1);
      }
      return;
    }
    if (e.key === 'ArrowDown' || code === 40 || code === 20) {
      e.preventDefault();
      if (currentChannelIndex < filteredChannels.length - 1) {
        playChannel(currentChannelIndex + 1);
      } else {
        playChannel(0);
      }
      return;
    }
  }

  if (code === 4 || code === 27 || code === 8 || code === 10009 || code === 461 || e.key === 'Backspace' || e.key === 'Escape') {
    if (isPlayerActive) {
      e.preventDefault();
      e.stopPropagation();
      closePlayer();
    }
  }
});
</script>
</body>
</html>
